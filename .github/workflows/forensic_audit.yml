name: Forensic Pipeline & Cryptographic Chain of Custody Audit

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  forensic-audit:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Execute Automated Test Suite
        run: |
          PYTHONPATH=. python tests/test_v4_suite.py

      - name: Execute 13-Step Master Forensic Pipeline
        run: |
          python pipeline_run_all.py

      - name: Verify ISO/IEC 27037 Evidence Ledger
        run: |
          python tools/hash_chain_verifier.py verify

